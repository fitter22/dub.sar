name: Emoji Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  emoji-scan:
    name: Verify Zero Emojis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Verify Zero Emojis Invariant
        run: |
          python3 bin/check_no_emojis.py
