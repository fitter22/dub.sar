name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install WABT
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Check published assets
        run: |
          test -f website/dist/index.html
          test -f website/dist/catalog.json
          test -f website/dist/runtime/runner.py
          test -f website/dist/runtime/sample.wat
          test -f website/dist/runtime/sample.wasm
          test -n "$(find website/dist/runtime -name 'dubsar-*.whl' -print -quit)"
