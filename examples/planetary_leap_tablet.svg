<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1034 1636" width="1034" height="1636">
  <defs>
    <!-- Clay gradient -->
    <linearGradient id="clayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb890" />
      <stop offset="30%" stop-color="#caa074" />
      <stop offset="70%" stop-color="#b6895b" />
      <stop offset="100%" stop-color="#9a6e42" />
    </linearGradient>
    <!-- Edge shadow gradient -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.35" />
    </linearGradient>
    <!-- Filter for clay bevel shadow -->
    <filter id="clayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#3c200c" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1034" height="1636" fill="#2a1f18" />

  <!-- Clay Tablet Body -->
  <rect x="25" y="25" width="984" height="1586" rx="32" ry="32"
        fill="url(#clayGradient)" filter="url(#clayShadow)" stroke="#744a25" stroke-width="3" />
  <rect x="25" y="25" width="984" height="1586" rx="32" ry="32"
        fill="url(#edgeGlow)" />

  <!-- Tablet Header / Case Ruling -->
  <text x="517.0" y="65" text-anchor="middle" font-family="sans-serif, Arial" font-weight="bold" font-size="20" fill="#3a1c06" letter-spacing="2">
    TABLET: PLANETARY_LEAP
  </text>
  <text x="517.0" y="88" text-anchor="middle" font-family="sans-serif, Arial" font-size="12" fill="#5c3413" letter-spacing="1">
    IM.GID.DA — MATHEMATICAL TABLET PRESCRIPTION
  </text>
  <line x1="55" y1="105" x2="979" y2="105" stroke="#683d18" stroke-width="2.5" stroke-linecap="round" />
  <line x1="55" y1="109" x2="979" y2="109" stroke="#dfb890" stroke-width="1" stroke-linecap="round" />

  <!-- Inscribed Text and Case Registers -->
  <g font-family="'Noto Sans Cuneiform', 'Segoe UI Historic', monospace" font-size="15" fill="#331904">
    <line x1="55" y1="138" x2="979" y2="138" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="130"># DUB.SAR 1.0 — Planetary Leap-Year Rule (Tablet Mode)</text>
    <line x1="55" y1="166" x2="979" y2="166" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="158"># As specified in Section 26 of DUB.SAR 1.0 Language Specification</text>
    <line x1="55" y1="194" x2="979" y2="194" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="186"></text>
    <line x1="55" y1="222" x2="979" y2="222" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="214">𒂊𒁹</text>
    <line x1="55" y1="250" x2="979" y2="250" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="242"></text>
    <line x1="55" y1="278" x2="979" y2="278" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="270">    𒈬 := 𒀀𒁹(&quot;solar year in days&quot;)</text>
    <line x1="55" y1="306" x2="979" y2="306" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="298">    maximum-cycle : 1000</text>
    <line x1="55" y1="334" x2="979" y2="334" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="326">    cycle, leaps, error := leap-rule(𒈬, maximum-cycle)</text>
    <line x1="55" y1="362" x2="979" y2="362" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="354"></text>
    <line x1="55" y1="390" x2="979" y2="390" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="382">𒁾𒊬 leap-rule(solar, limit):</text>
    <line x1="55" y1="418" x2="979" y2="418" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="410"></text>
    <line x1="55" y1="446" x2="979" y2="446" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="438">    whole := floor(solar)</text>
    <line x1="55" y1="474" x2="979" y2="474" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="466">    fraction := solar - whole</text>
    <line x1="55" y1="502" x2="979" y2="502" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="494">    fraction-count := fraction / 1 𒌓</text>
    <line x1="55" y1="530" x2="979" y2="530" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="522"></text>
    <line x1="55" y1="558" x2="979" y2="558" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="550">    best-cycle := 1</text>
    <line x1="55" y1="586" x2="979" y2="586" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="578">    best-leaps := 0</text>
    <line x1="55" y1="614" x2="979" y2="614" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="606">    best-error := abs(solar - whole)</text>
    <line x1="55" y1="642" x2="979" y2="642" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="634"></text>
    <line x1="55" y1="670" x2="979" y2="670" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="662">    𒄀 cycle 1 𒌗 limit:</text>
    <line x1="55" y1="698" x2="979" y2="698" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="690"></text>
    <line x1="55" y1="726" x2="979" y2="726" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="718">        estimated-leaps := nearest(cycle * fraction-count)</text>
    <line x1="55" y1="754" x2="979" y2="754" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="746">        candidate := whole + (estimated-leaps / cycle) * 1 𒌓</text>
    <line x1="55" y1="782" x2="979" y2="782" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="774">        error := abs(solar - candidate)</text>
    <line x1="55" y1="810" x2="979" y2="810" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="802"></text>
    <line x1="55" y1="838" x2="979" y2="838" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="830">        𒂊𒀀 error &lt; best-error:</text>
    <line x1="55" y1="866" x2="979" y2="866" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="858"></text>
    <line x1="55" y1="894" x2="979" y2="894" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="886">            best-error := error</text>
    <line x1="55" y1="922" x2="979" y2="922" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="914">            best-cycle := cycle</text>
    <line x1="55" y1="950" x2="979" y2="950" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="942">            best-leaps := estimated-leaps</text>
    <line x1="55" y1="978" x2="979" y2="978" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="970"></text>
    <line x1="55" y1="1006" x2="979" y2="1006" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="998">    𒄑 best-cycle, best-leaps, best-error</text>
    <line x1="55" y1="1034" x2="979" y2="1034" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1026"></text>
    <line x1="55" y1="1062" x2="979" y2="1062" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1054">𒅗𒁹</text>
    <line x1="55" y1="1090" x2="979" y2="1090" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1082"></text>
    <line x1="55" y1="1118" x2="979" y2="1118" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1110">    𒁹𒀀 &quot;normal days:&quot;</text>
    <line x1="55" y1="1146" x2="979" y2="1146" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1138">    𒁹𒀀 floor(𒈬)</text>
    <line x1="55" y1="1174" x2="979" y2="1174" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1166"></text>
    <line x1="55" y1="1202" x2="979" y2="1202" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1194">    𒁹𒀀 &quot;cycle years:&quot;</text>
    <line x1="55" y1="1230" x2="979" y2="1230" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1222">    𒁹𒀀 cycle</text>
    <line x1="55" y1="1258" x2="979" y2="1258" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1250"></text>
    <line x1="55" y1="1286" x2="979" y2="1286" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1278">    𒁹𒀀 &quot;leap years:&quot;</text>
    <line x1="55" y1="1314" x2="979" y2="1314" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1306">    𒁹𒀀 leaps</text>
    <line x1="55" y1="1342" x2="979" y2="1342" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1334"></text>
    <line x1="55" y1="1370" x2="979" y2="1370" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1362">    𒁹𒀀 &quot;common years:&quot;</text>
    <line x1="55" y1="1398" x2="979" y2="1398" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1390">    𒁹𒀀 cycle - leaps</text>
    <line x1="55" y1="1426" x2="979" y2="1426" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1418"></text>
    <line x1="55" y1="1454" x2="979" y2="1454" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1446">    𒁹𒀀 &quot;mean calendar year:&quot;</text>
    <line x1="55" y1="1482" x2="979" y2="1482" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1474">    𒁹𒀀 floor(𒈬) + (leaps / cycle) * 1 𒌓</text>
    <line x1="55" y1="1510" x2="979" y2="1510" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1502"></text>
    <line x1="55" y1="1538" x2="979" y2="1538" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1530">    𒁹𒀀 &quot;error in days/year:&quot;</text>
    <line x1="55" y1="1566" x2="979" y2="1566" stroke="#78481e" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4" />
    <text x="65" y="1558">    𒁹𒀀 error</text>
  </g>

  <!-- Colophon Bottom Seal -->
  <line x1="55" y1="1601" x2="979" y2="1601" stroke="#683d18" stroke-width="2" />
  <text x="517.0" y="1621" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d411b" letter-spacing="1">
    * DUB.SAR 1.0 CANONICAL TABLET *
  </text>
</svg>